[server]
# Docker has no hot-reload; disable watcher to avoid probing transformers submodules
# that optionally import torchvision (not installed — not needed for embeddings).
fileWatcherType = "none"
# Served under /app behind the edge Caddy (public gate owns /).
baseUrlPath = "app"

[client]
# Private pilot: no "Ask ChatGPT" / Google links on errors; keep messages user-safe.
showErrorLinks = false
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[theme]
# Light tokens from the shared demo kit. Dark mode is data-theme, set before paint.
# backgroundColor is the page. secondary stays white so inputs and chips stay lifted.
# Boot CSS, not secondaryBackgroundColor, stops a white flash. Dark uses #14061f there.
primaryColor = "#9d174d"
backgroundColor = "#f8f4f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c1024"
font = "Plus Jakarta Sans"
headingFont = "Plus Jakarta Sans"

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "/app/demo-kit/fonts/plus-jakarta-sans-latin.woff2"
weight = "400 700"
style = "normal"
