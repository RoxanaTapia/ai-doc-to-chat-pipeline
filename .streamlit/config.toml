[server]
# Docker has no hot-reload; disable watcher to avoid probing transformers submodules
# that optionally import torchvision (not installed — not needed for embeddings).
fileWatcherType = "none"
# Served under /app behind the edge Caddy (public gate owns /).
baseUrlPath = "app"

[client]
# Private pilot: no "Ask ChatGPT" / Google links on errors; keep messages user-safe.
showErrorLinks = false
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[theme]
# Match receipt-intelligence-demo: indigo accent, off-white paper, near-black ink.
primaryColor = "#3d4fd8"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a1f24"
