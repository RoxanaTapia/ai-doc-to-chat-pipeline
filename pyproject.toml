[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-doc"
version = "1.0.0"
description = "Grounded answers from a confidential PDF, with page citations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pymupdf>=1.27.1",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "langchain>=1.2.10,<2.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    "langchain-huggingface>=1.2.0,<2.0.0",
    "langchain-text-splitters>=1.1.1,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "faiss-cpu>=1.13.2,<1.14.0",
    "numpy>=2.4.2,<3.0.0",
    "sentence-transformers>=5.2.3",
    "rank-bm25>=0.2.2",
    "transformers>=5.2.0,<6.0.0",
    "torch>=2.10.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama",
    "ollama",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.54.0,<1.55.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_doc*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]
# First-party imports: the installable core and the Streamlit demo.
src = ["src", "apps/demo"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
]
