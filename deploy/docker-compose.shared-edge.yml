# Overlay for an existing reverse proxy in front of the app.
# The proxy owns the public ports. This file does not publish the app port.
#
# Create the external network once:
#   docker network create edge
#
# From repo root:
#   docker compose --env-file .env -p ai-doc-to-chat-pipeline \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.shared-edge.yml up -d
#
# Stable alias for the reverse proxy: app:8501
# Forward traffic to that alias. If Streamlit uses a baseUrlPath, keep that prefix.
# Operator notes: docs/operators/running.md

services:
  app:
    ports: !override []
    networks:
      default: {}
      edge:
        aliases:
          - app

networks:
  edge:
    external: true
    name: edge
