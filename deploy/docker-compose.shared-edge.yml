# Join the portfolio VPS edge network. Caddy and invites run in roxanatapia-edge.
#
# Create once on the host: docker network create edge
#
# From repo root:
#   docker compose --env-file .env -p ai-doc-to-chat-pipeline \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.shared-edge.yml up -d
#
# Alias `app` is what the edge Caddyfile reverse_proxy targets (app:8501).
# Do not publish 8501 on that host. Operator notes: docs/operators/running.md

services:
  app:
    ports: !override []
    networks:
      default: {}
      edge:
        aliases:
          - app

networks:
  edge:
    external: true
    name: edge
