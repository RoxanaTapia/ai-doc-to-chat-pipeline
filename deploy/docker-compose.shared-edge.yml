# Shared-host overlay. Another process (roxanatapia-edge Caddy) owns 80/443.
#
# Create the network once on the VPS:
#   docker network create edge
#
# From repo root:
#   docker compose --env-file .env -p ai-doc-to-chat-pipeline \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.shared-edge.yml up -d
#
# This repo has no Caddy service. Do not start one on the portfolio VPS.
#
# Stable alias for the edge Caddyfile: app:8501
# Caddy forwards /app* to that alias and keeps the /app prefix
# (Streamlit baseUrlPath). Do not publish 8501 on that host.
# Operator notes: docs/operators/running.md

services:
  app:
    ports: !override []
    networks:
      default: {}
      edge:
        aliases:
          - app

networks:
  edge:
    external: true
    name: edge
