# App (+ optional api profile). Public HTTPS is not this file.
# Run behind an existing reverse proxy when the app should face the internet.
# Local: docker compose -f deploy/docker-compose.yml up --build -d
# Overlay (no published app port): docker-compose.shared-edge.yml
# Operator notes: docs/operators/running.md

services:
  app:
    build:
      # context = repo root (.dockerignore lives there); dockerfile path is relative to context
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8501:8501"
    environment:
      # Core on src/; demo modules live in apps/demo (Streamlit also adds the script dir).
      PYTHONPATH: /app/src:/app/apps/demo
      # Empty LLM_PROVIDER selects Claude unless USE_DUMMY_GENERATOR=true.
      USE_DUMMY_GENERATOR: ${USE_DUMMY_GENERATOR:-false}
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
      TOKENIZERS_PARALLELISM: "false"
      # Client-facing host: APP_ALLOW_DEV_TOGGLE=false APP_PRESENTATION_MODE=client
      APP_ALLOW_DEV_TOGGLE: ${APP_ALLOW_DEV_TOGGLE:-false}
      APP_PRESENTATION_MODE: ${APP_PRESENTATION_MODE:-client}
    restart: unless-stopped

  # Thin API (optional). Same image as app; OpenAPI at http://localhost:8000/docs
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      PYTHONPATH: /app/src
      USE_DUMMY_GENERATOR: ${USE_DUMMY_GENERATOR:-false}
    command:
      [
        "uvicorn",
        "ai_doc.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    restart: unless-stopped
    profiles:
      - api
